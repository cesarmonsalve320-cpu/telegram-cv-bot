services:
  - type: web
    name: telegram-cv-autopilot-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    plan: free
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: SPONSOR_CHANNEL_URL
        value: https://t.me/empleosremotos_oficial
      - key: PYTHON_VERSION
        value: 3.12.0
